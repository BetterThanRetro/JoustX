# The browser build over HTTP (port 80) and HTTPS (port 443, with a self-signed certificate
# made in the image), so it can be tried the way a public host such as GitHub Pages serves it.
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/nginx/joustx.crt;
    ssl_certificate_key /etc/nginx/joustx.key;
    root /usr/share/nginx/html;

    # .NET's WebAssembly files; nginx's mime.types has wasm and js, add the rest.
    types {
        application/wasm wasm;
        text/javascript js mjs;
        application/json json;
        application/octet-stream dat img;
        text/html html;
        text/css css;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
