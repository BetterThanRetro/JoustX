server {
    listen 80;
    root /usr/share/nginx/html;

    # .NET's WebAssembly files; nginx's mime.types has wasm and js, add the rest.
    types {
        application/wasm wasm;
        text/javascript js mjs;
        application/json json;
        application/octet-stream dat img;
        text/html html;
        text/css css;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
